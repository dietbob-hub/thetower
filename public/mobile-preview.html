<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Tower — Mobile Preview 18.3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,sans-serif;color:#e8dfcc;background:#090f1c}body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;overflow:auto}header{text-align:center;max-width:680px}h1{font:bold 21px Georgia,serif;color:#e9c987;margin:0 0 5px}p{margin:0;color:#bac6d6;font-size:12px;line-height:1.4}nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}button,a{font:600 12px system-ui;padding:10px 12px;border:1px solid #a48755;color:#f4dfb4;background:#192538;border-radius:5px;text-decoration:none;cursor:pointer;min-height:40px}button[aria-pressed=true]{border-color:#edcc89;background:#58452d;color:#fff0bf}.phone{width:min(390px,100%);height:844px;max-height:calc(100dvh - 154px);min-height:260px;border:3px solid #c3a46c;border-radius:18px;background:#101929;box-shadow:0 8px 35px #0008;overflow:hidden;flex-shrink:0}.phone.landscape{width:min(844px,100%);height:390px;max-height:calc(100dvh - 154px);border-radius:15px}iframe{display:block;width:100%;height:100%;border:0;background:#111a28}small{color:#a8b4c7;text-align:center;font-size:11px}</style></head><body><header><h1>The Tower · Mobile preview</h1><p>Real game interface in a phone-size frame. Sample roster and isolated progress; no live account connection.</p></header><nav><button data-view="camp" aria-pressed="true">Camp</button><button data-view="doors" aria-pressed="false">Doors</button><button data-view="tree" aria-pressed="false">Sphere Grid</button><button id="rotate" aria-pressed="false">Landscape</button><a href="./index.html">Play full game</a></nav><div class="phone" id="phone"><iframe id="game" title="Interactive isolated mobile Tower preview" src="./index.html?mobileDemo=camp" sandbox="allow-scripts"></iframe></div><small>Portrait target: 390 × 844 CSS pixels, reduced to available screen space.</small><script>const frame=document.getElementById('game'),phone=document.getElementById('phone'),rotate=document.getElementById('rotate');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src='./index.html?mobileDemo='+b.dataset.view;});rotate.onclick=()=>{const on=phone.classList.toggle('landscape');rotate.textContent=on?'Portrait':'Landscape';rotate.setAttribute('aria-pressed',String(on));};</script></body></html>
